services:
  - type: web
    name: rrr-capability-engine
    runtime: node
    plan: free
    region: oregon # or frankfurt, ohio, virginia
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
